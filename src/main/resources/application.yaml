server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: yu-picture-backend
  session:
    # 登录会话外部化到 Redis（默认 localhost:6379）：后端重启/多实例共享会话。
    # Redis 未启动时登录链路不可用——本机开发需要先起 redis-server
    store-type: redis
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture
    username: root
    password: sphz0361
  profiles:
    active: local
  servlet:
    multipart:
      # 视频与封面在同一次请求内提交：单 part 上限按视频 50MB 给，请求总上限再加 5MB 给封面。
      # 放宽的是"能被接收"，图片 50MB、头像 2MB、视频 50MB 这些接口自己的业务校验仍然生效
      max-file-size: 52MB
      max-request-size: 58MB
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted #全局的 Entity 逻辑删除字段属性名，仅在逻辑删除功能打开时有效。
      logic-delete-value: 1 #逻辑已删除值(默认值：1)
      logic-not-delete-value: 0 #逻辑未删除值(默认值：0)
# 接口文档
knife4j:
  enable: true
  openapi:
    title: doc
    version: 1.0
    group:
      test1:
        api-rule: package
        api-rule-resources:
          - com.yupi.yupicturebackend.controller



